<style>
  .publication-list {
    margin: 2rem 0 0;
    padding-left: 1.5rem;
  }

  .publication-list li {
    margin-bottom: 1.25rem;
    padding-left: 0.25rem;
    font-size: 1rem;
    line-height: 1.55;
  }

  .publication-list li:last-child {
    margin-bottom: 0;
  }
</style>

<ul class="publication-list">
  {% assign publications = site.publications | sort: "date" | reverse %}
  {% for post in publications %}
    <li>{{ post.citation }}</li>
  {% endfor %}
</ul>
